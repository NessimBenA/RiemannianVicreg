defaults:
  - lanistr_base

seed: 42

dataset:
  name: "mug"
  dataset_type: "pokemon_primary_type"
  data_dir: "./data/MuG"
  text: true
  image: true
  tab: true

training:
  mode: "simsiam_finetune"
  task: "pretrain"
  batch_size: 64
  learning_rate: 1e-4
  num_epochs: 50
  warmup_epochs: 5
  weight_decay: 0.02
  freeze_encoders: true

output_dir: "./output/lanistr_mug_simsiam_finetune"
