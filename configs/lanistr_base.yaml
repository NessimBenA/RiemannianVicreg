seed: 42

dataset:
  name: "mug"
  dataset_type: "pokemon_primary_type"
  data_dir: "./data/MuG"
  text: true
  image: true
  tab: true
  test_ratio: 0.15
  val_ratio: 0.05

training:
  mode: "supervised"
  task: "finetune"
  ssl_objective: "simsiam"
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 1e-4
  num_epochs: 100
  warmup_epochs: 10
  weight_decay: 0.01
  gradient_clip: 1.0
  workers: 12
  freeze_encoders: false

encoders:
  image:
    name: "WinKawaks/vit-tiny-patch16-224"
    pretrained: false 
    trainable: true
    image_size: 224
    patch_size: 16
    mask_patch_size: 16
    masking_ratio: 0.5

  text:
    name: "prajjwal1/bert-mini"
    pretrained: false 
    trainable: true
    max_token_length: 128
    mlm_probability: 0.15

  tabular:
    n_d: 64
    n_a: 64
    cat_emb_dim: 3
    embedding_dim: 128
    trainable: true
    pretraining_ratio: 0.15

fusion:
  type: "transformer"
  use_flava: false
  flava_pretrained: false
  flava_trainable: true
  mlp_hidden_dim: 512
  output_dim: 256

projection:
  type: "SimSiam"
  hidden_dim: 256
  output_dim: 256

simsiam:
  predictor_hidden_dim: 128
  predictor_output_dim: 256

vicreg:
  sim_coeff: 25.0
  std_coeff: 25.0
  cov_coeff: 1.0

riemannian:
  enabled: false
  num_factors: 1
  factor_dim: 256
  kappa: -1.0
  learnable_kappa: true
  kappa_lr_scale: 1.0
  per_factor_kappa: false
  factor_separated_projector: false
  factor_head_hidden: 64
  kappa_init_noise: 0.01
  kappa_init_spread: 0.0
  kappa_image: -1.0
  kappa_text: -1.0
  kappa_tabular: -1.0
  lambda_set: 25.0
  lambda_var: 25.0
  lambda_cov: 1.0
  gamma: 1.0
  eps: 0.0001
  clip_delta: 0.001
  use_isotropy: false
  use_frechet_mean: false
  frechet_normalize_tangents: false

classifier:
  hidden_dim: 256
  dropout: 0.3

loss_weights:
  lambda_mlm: 1.0
  lambda_mim: 1.0
  lambda_mfm: 0.01
  lambda_mmm: 1.0

device: "cuda"
output_dir: "./output/lanistr"
